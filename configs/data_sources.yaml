    authority_level: "primary"
    expected_update_frequency: "Updated as new match data is processed and site is rebuilt"
    intended_project_use: "Input for Model B (Domestic-to-Franchise Translation Model predicting IPL performance percentiles for uncapped Indian players)."
    known_limitations: "Unverified historical match completion percentage across earlier seasons."
    validation_strategy: "Cross-validate match counts with official domestic scorecards; enforce minimum delivery sample thresholds (N >= 120)."

