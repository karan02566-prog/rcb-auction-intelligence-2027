# Data Source Register for RCB Auction Intelligence Engine
# Authoritative registry of external data sources, verified URLs, provenance, and validation strategies.

sources:
  - source_name: "Cricsheet IPL Ball-by-Ball Dataset"
    provider: "Cricsheet (cricsheet.org)"
    competition: "Indian Premier League (IPL)"
    url: "https://cricsheet.org/downloads/ipl_json.zip"
    format: "JSON (ZIP archive)"
    coverage: "1,243 male IPL matches (2008–2025)"
    retrieval_method: "Direct HTTP GET download"
    license_or_usage_notes: "Open Data Commons Attribution License (ODC-By 1.0)"
    authority_level: "primary"
    expected_update_frequency: "Updated as new match data is processed and site is rebuilt"
    intended_project_use: "Core ball-by-ball ingestion for IPL batter, bowler, phase metrics, venue splits, and pitch clustering."
    known_limitations: "Lacks spatial ball-tracking coordinates (wagon wheel angles, pitch map) and explicit fielding chance logs."
    validation_strategy: "Validate match counts and player IDs against Cricsheet People Register and official IPL scorecards."

