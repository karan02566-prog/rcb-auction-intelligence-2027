  - source_name: "Cricsheet People Register"
    provider: "Cricsheet (cricsheet.org)"
    competition: "Global Cricket Player Identifiers"
    url: "https://cricsheet.org/register/people.csv"
    format: "CSV"
    coverage: "18,507 people with 28,401 identifiers across 12 identifier/data sources"
    retrieval_method: "Direct HTTP GET download"
    license_or_usage_notes: "Open Data Commons Attribution License (ODC-By 1.0)"
    authority_level: "primary"
    expected_update_frequency: "Updated whenever a new person is added to Cricsheet match data or a new identifier is added"
    intended_project_use: "Canonical player identity mapping (player_id), name key standardization, and cross-source ID resolution."
    known_limitations: "Does not contain player auction valuation data, retentions, or injury availability status."
    validation_strategy: "Cross-reference against configs/player_mapping.json for alias resolution and verify against official squad list names."

  - source_name: "IPL Official Auction Archive"
    provider: "Board of Control for Cricket in India (BCCI) / IPL Official (iplt20.com)"
    competition: "Indian Premier League (IPL) Auctions"
    url: "https://www.iplt20.com/auction"
    format: "Web HTML tables and official PDF press releases"
    coverage: "2014–2025 seasons verified on iplt20.com portal; 2008–2013 historical coverage unverified on web portal"
    retrieval_method: "Manual extraction from official web tables and PDF media advisories"
    license_or_usage_notes: "Site terms of use apply (no explicit open-source data license documented)"
    authority_level: "primary"
    expected_update_frequency: "Annual (following each IPL auction event)"
    intended_project_use: "Target variable dataset for Model A1 (Expected Market Price) and Model A2 (Fair Value calibration)."
    known_limitations: "Inconsistent web table layout across early seasons; requires dual-entry verification."
    validation_strategy: "Dual-entry cross-verification against official BCCI press releases and secondary sports news archives (ESPNcricinfo)."

  - source_name: "Kaggle IPL Auction Dataset (2013-2026)"
    provider: "Kaggle (sunnyyadav754/ipl-auction-dataset-20132026)"
    competition: "Indian Premier League (IPL) Auctions"
    url: "https://www.kaggle.com/datasets/sunnyyadav754/ipl-auction-dataset-20132026"
    format: "CSV (one file per auction year)"
    coverage: "2013-2026, 1,381 total player-auction records"
    retrieval_method: "Manual browser download (zip) from Kaggle. Official iplt20.com sources (BCCI PDF, ESPNcricinfo HTML) returned S3 AccessDenied / Akamai edge blocks on automated fetch as of 2026-09-10; not pursued further."
    license_or_usage_notes: "Compiled for non-commercial research per dataset author; not an official BCCI/IPL publication."
    authority_level: "secondary"
    expected_update_frequency: "Community-maintained, update cadence unclear."
    intended_project_use: "Working source for historical sold/base price data (Model A1/A2 target variable), given the official primary source is inaccessible to automated ingestion."
    known_limitations: "Schema drift across years (documented in src/ingestion/auction_consolidate.py); no retention/RTM status field; 2013 prices in native USD with no documented FX rate to convert (kept unconverted); community-compiled, not independently audited by BCCI/IPL."
    validation_strategy: "Spot-checked 2 known 2025 records against ESPNcricinfo's live auction page (Rishabh Pant Rs 27.00 Cr -> LSG, Shreyas Iyer Rs 26.75 Cr -> PBKS) -- both matched exactly. Franchise-total-vs-purse-cap validation still outstanding (see memory.md Known Issues)."
